name: Extrair zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair e guardar no repositório
        run: |
          unzip -oq ./*.zip -d .
          rm -f ./*.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extrair projeto do zip"
          git push
